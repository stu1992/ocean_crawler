version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: react_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dotnet_backend
    ports:
      - "5000:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge